<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Janjeevan.store | Customer Sign In</title>
    <meta name="description" content="Sign in to your Janjeevan.store customer account.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="merchant-page customer-page">
    <header class="store-header">
        <a class="store-brand" href="index.html"><img src="TribesLogo.jpg" alt="Janjeevan.store logo"><span>Janjeevan.store</span></a>
        <nav aria-label="Main navigation">
            <a href="index.html">Shop</a>
            <a href="cart.html">Cart</a>
            <a class="active" href="customer-login.html">Customer Sign In</a>
        </nav>
    </header>

    <main class="merchant-wrap">
        <section class="merchant-card customer-auth-card">
            <div class="merchant-header">
                <p class="store-kicker">Welcome to Janjeevan</p>
                <h1>Customer Sign In</h1>
                <p>Sign in with your registered mobile number and password.</p>
            </div>
            <form id="customer-login-form" novalidate>
                <label>Mobile Number
                    <input id="customer-mobile" name="mobile" type="tel" inputmode="numeric" autocomplete="tel"
                        minlength="10" maxlength="10" pattern="[0-9]{10}" placeholder="10-digit mobile number" required>
                </label>
                <label>Password
                    <input id="customer-password" name="password" type="password" autocomplete="current-password"
                        placeholder="Enter your password" required>
                </label>
                <button type="submit" class="submit-btn">Sign in</button>
            </form>
            <p id="customer-status" class="status-message" role="status" aria-live="polite"></p>
            <p class="customer-auth-switch">New to Janjeevan? <a href="customer-registration.html">Create an account</a>
            </p>
        </section>
    </main>

    <footer class="store-footer">
        <div class="footer-meta">
            <a href="mailto:comtribes@gmail.com">Contact us: comtribes@gmail.com</a>
            <small>© 2026 Janjeevan.store. All rights reserved.</small>
        </div>
    </footer>
    <script src="js/customer-login.js"></script>
</body>

</html>
